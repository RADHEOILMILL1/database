modal(`<h3>${t('ledger')} · ${esc(c.name)} ${esc(c.mobile)}</h3><div class="sc"><table><tr><th>${t('date')}</th><th></th><th>Dr</th><th>Cr</th><th>${t('bal')}</th></tr>${e.map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${M(x.dr)}</td><td>${M(x.cr)}</td><td>${M(r+=x.dr-x.cr)}</td></tr>`).join('')}</table></div><b class="${r>0?'bad':'ok'}">${t('bal')}: ${M(r)}</b><label>${t('recv')}<input id="pa" type="number" min="0"></label><div class="bt"><button class="b2" onclick="cl()">${t('close')}</button><button class="b1" onclick="RC('${id}')">${t('recv')}</button></div>`)}
function RC(id){const a=+$('#pa').value;if(a<=0)return toast(t('req'));DB.pay.push({id:uid(),cid:id,amt:a,date:td()});save();LD(id);go()}
V.bill=()=>`<button class="b1" onclick="NB()">+ ${t('newbill')}</button>`+tbl('b',[{k:'no',f:x=>'ROM-'+x.no},{k:'date'},{k:'name'},{k:'total',f:x=>M(x.total)},{k:'paid',f:x=>M(x.paid)},{k:'st',l:'status',f:x=>`<span class="${x.st=='paid'?'ok':'bad'}">${t(x.st)}</span>`}],[...DB.bills].reverse().map(b=>({...b,st:b.paid>=b.total?'paid':b.paid>0?'partial':'unpaid'})),x=>`<button class="sm" onclick="INV('${x.id}')">🖨</button><button class="sm" onclick="WA('${x.id}')">WA</button>${me.role=='admin'?`<button class="sm" onclick="DL('bills','${x.id}')">🗑</button>`:''}`);
function lineRow(){return `<div class="lr"><select class="lp" onchange="calc()">${DB.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name+' '+p.size)} – ${M(p.price)} (${p.stock})</option>`).join('')}</select><input class="lq" type="number" min="1" value="1" oninput="calc()"><button class="b2" onclick="this.parentNode.remove();calc()">✕</button></div>`}
function NB(){if(!DB.products.some(p=>p.stock>0))return toast(t('stock')+': 0');modal(`<h3>${t('newbill')}</h3><label>${t('date')}<input id="b_dt" type="date" value="${td()}"></label><label>${t('cust')}<select id="b_c"><option value="">${t('walkin')}</option>${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><input id="b_n" placeholder="${t('name')}"><input id="b_m" placeholder="${t('mobile')}"><div id="li">${lineRow()}</div><button class="b2" onclick="$('#li').insertAdjacentHTML('beforeend',lineRow());calc()">+ ${t('add')}</button><label>${t('disc')} ₹<input id="b_disc" type="number" min="0" value="0" oninput="calc()"></label><label>${t('type')}<select id="b_gst" onchange="calc()"><option value="0">${t('nogst')}</option><option value="1">${t('gst')} (${DB.set.gst}%)</option></select></label><label>${t('status')}<select id="b_st"><option value="paid">${t('paid')}</option><option value="unpaid">${t('unpaid')}</option><option value="partial">${t('partial')}</option></select></label><input id="b_pd" type="number" min="0" placeholder="${t('partial')} ${t('paid')} ₹"><h3>${t('total')}: <span id="b_tot"></span></h3><div class="bt"><button class="b2" onclick="cl()">${t('cancel')}</button><button class="b1" onclick="SB()">${t('save')}</button></div>`);calc()}
function calc(){let s=0;document.querySelectorAll('.lr').forEach(r=>{const p=DB.products.find(x=>x.id==r.querySelector('.lp').value);s+=p?p.price*(+r.querySelector('.lq').value||0):0});const d=+$('#b_disc').value||0,g=$('#b_gst').value=='1'?R((s-d)*DB.set.gst/100):0,tot=R(Math.max(0,s-d+g));$('#b_tot').textContent=M(tot);return{sub:s,d,g,tot}}
